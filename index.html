<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TaskFlow">
<meta name="theme-color" content="#080b14">
<title>TaskFlow — Daily Task Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #080b14;
  --surface:   #111726;
  --surface2:  #182035;
  --surface3:  #1f2a42;
  --border:    rgba(91,127,255,0.10);
  --border2:   rgba(91,127,255,0.20);
  --text:      #e8eeff;
  --text2:     #7a8aaa;
  --text3:     #38455e;
  --accent:    #5b7fff;
  --accent2:   #7c9bff;
  --accent-glow: rgba(91,127,255,0.25);
  --green:     #23e89a;
  --green-dim: rgba(35,232,154,0.13);
  --amber:     #f59e2a;
  --amber-dim: rgba(245,158,42,0.13);
  --red:       #ff5372;
  --red-dim:   rgba(255,83,114,0.13);
  --hold:      #b08aff;
  --hold-dim:  rgba(176,138,255,0.13);
  --blue:      #38c4f8;
  --blue-dim:  rgba(56,196,248,0.10);
  --teal:      #14d0b5;
  --teal-dim:  rgba(20,208,181,0.13);
  --rose:      #ff7a45;
  --rose-dim:  rgba(255,122,69,0.13);
  --r:         14px;
  --r-sm:      10px;
  --r-xs:      8px;
  --nav-h:     72px;
  --safe-b:    env(safe-area-inset-bottom, 0px);
  --header-h:  56px;
}

/* ── RESET & BASE ─────────────────────────────── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { scroll-behavior:smooth; height:100%; -webkit-text-size-adjust:100%; }
body {
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; min-height:100dvh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ── SPLASH ──────────────────────────────────── */
#splash {
  position:fixed; inset:0; background:var(--bg); z-index:9999;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:opacity 0.55s ease, transform 0.55s ease;
}
#splash.hide { opacity:0; transform:scale(1.04); pointer-events:none; }

.splash-ring { position:relative; width:108px; height:108px; margin-bottom:28px; }
.splash-ring-svg { width:108px; height:108px; transform:rotate(-90deg); }
.splash-ring-bg { fill:none; stroke:var(--surface3); stroke-width:3; }
.splash-ring-arc {
  fill:none; stroke:url(#splashGrad); stroke-width:3; stroke-linecap:round;
  stroke-dasharray:300; stroke-dashoffset:75;
  animation:arcSpin 2s ease-in-out infinite;
}
@keyframes arcSpin { 0%{stroke-dashoffset:75;} 50%{stroke-dashoffset:240;} 100%{stroke-dashoffset:75;} }
.splash-icon-inner { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.splash-icon-box {
  width:62px; height:62px; border-radius:18px;
  background:linear-gradient(135deg,#5b7fff 0%,#b08aff 55%,#23e89a 100%);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 40px var(--accent-glow), 0 0 80px rgba(35,232,154,0.08);
}
.splash-icon-box svg { width:32px; height:32px; }
.splash-name {
  font-size:32px; font-weight:800; letter-spacing:-1px;
  background:linear-gradient(135deg,#fff 25%,#b08aff 85%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  margin-bottom:6px;
}
.splash-tagline { font-size:13px; color:var(--text2); letter-spacing:0.5px; margin-bottom:52px; }
.splash-dots { display:flex; gap:7px; }
.splash-dot {
  width:5px; height:5px; border-radius:50%; background:var(--surface3);
  animation:dotFill 1.6s ease-in-out infinite;
}
.splash-dot:nth-child(1){animation-delay:0s;}
.splash-dot:nth-child(2){animation-delay:0.27s;}
.splash-dot:nth-child(3){animation-delay:0.54s;}
@keyframes dotFill { 0%,80%,100%{background:var(--surface3);transform:scale(1);} 40%{background:var(--accent);transform:scale(1.4);} }
.splash-version { position:absolute; bottom:calc(24px + var(--safe-b)); font-size:11px; color:var(--text3); font-family:'JetBrains Mono',monospace; }

/* ── APP SHELL ───────────────────────────────── */
#app {
  opacity:0; transform:translateY(12px);
  transition:opacity 0.45s ease, transform 0.45s ease;
  min-height:100vh; min-height:100dvh;
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 12px);
}
#app.visible { opacity:1; transform:translateY(0); }

/* ── HEADER ──────────────────────────────────── */
.app-header {
  position:sticky; top:0; z-index:100;
  background:rgba(8,11,20,0.92);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:0 16px;
  padding-top:env(safe-area-inset-top, 0px);
}
.header-inner {
  display:flex; align-items:center; justify-content:space-between;
  height:var(--header-h); max-width:700px; margin:0 auto;
}
.app-logo { display:flex; align-items:center; gap:10px; }
.logo-mark {
  width:34px; height:34px; border-radius:10px;
  background:linear-gradient(135deg,#5b7fff,#23e89a);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 14px var(--accent-glow); flex-shrink:0;
}
.logo-mark svg { width:18px; height:18px; }
.logo-name { font-size:16px; font-weight:800; letter-spacing:-0.3px; color:var(--text); }

.header-right { display:flex; align-items:center; gap:8px; }
.header-date { font-size:11px; color:var(--text3); font-family:'JetBrains Mono',monospace; white-space:nowrap; }
.ring-wrap { position:relative; width:36px; height:36px; flex-shrink:0; }
.ring-svg { width:36px; height:36px; transform:rotate(-90deg); }
.ring-bg { fill:none; stroke:var(--surface3); stroke-width:3.5; }
.ring-fill {
  fill:none; stroke:url(#hdrGrad); stroke-width:3.5; stroke-linecap:round;
  stroke-dasharray:94.25; stroke-dashoffset:94.25;
  transition:stroke-dashoffset 0.7s cubic-bezier(.4,0,.2,1);
}
.ring-pct {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:8.5px; font-weight:700; color:var(--accent2);
  font-family:'JetBrains Mono',monospace;
}

/* ── CONTAINER ───────────────────────────────── */
.container { max-width:700px; margin:0 auto; padding:14px 12px 6px; }

/* ── STAT STRIP ──────────────────────────────── */
.stats-strip {
  display:grid; grid-template-columns:repeat(5,1fr);
  gap:6px; margin-bottom:14px;
}
.stat-chip {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-sm); padding:10px 4px; text-align:center; gap:4px;
}
.stat-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.stat-val { font-size:18px; font-weight:700; font-family:'JetBrains Mono',monospace; line-height:1; }
.stat-lbl { font-size:9px; color:var(--text3); letter-spacing:0.3px; text-transform:uppercase; font-weight:600; }
.s-total .stat-dot{background:var(--accent2);} .s-total .stat-val{color:var(--accent2);}
.s-done .stat-dot{background:var(--green);}    .s-done .stat-val{color:var(--green);}
.s-prog .stat-dot{background:var(--amber);}    .s-prog .stat-val{color:var(--amber);}
.s-hold .stat-dot{background:var(--hold);}     .s-hold .stat-val{color:var(--hold);}
.s-pend .stat-dot{background:var(--text3);}    .s-pend .stat-val{color:var(--text2);}

/* ── PANELS ──────────────────────────────────── */
.panel { display:none; }
.panel.active { display:block; animation:panelIn 0.2s ease; }
@keyframes panelIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }

/* ── BOTTOM NAV ──────────────────────────────── */
.bottom-nav {
  position:fixed; bottom:0; left:0; right:0;
  height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:rgba(8,11,20,0.94);
  backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--border);
  z-index:200;
  display:flex; align-items:center; justify-content:space-around;
  padding-left:8px; padding-right:8px;
}
.nav-btn {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; padding:10px 24px;
  border:none; background:none; cursor:pointer;
  color:var(--text3); transition:color 0.18s;
  border-radius:12px; min-width:64px;
  -webkit-user-select:none; user-select:none;
}
.nav-btn.active { color:var(--accent2); }
.nav-btn svg { width:24px; height:24px; transition:transform 0.18s; }
.nav-btn.active svg { transform:scale(1.1); }
.nav-label { font-size:10px; font-weight:600; letter-spacing:0.2px; }

/* FAB add button */
.nav-add-btn {
  width:54px; height:54px; border-radius:16px;
  background:linear-gradient(135deg,#5b7fff,#7c9bff);
  box-shadow:0 4px 22px var(--accent-glow);
  display:flex; align-items:center; justify-content:center;
  border:none; cursor:pointer;
  transition:transform 0.15s, box-shadow 0.15s;
  margin-top:-14px; flex-shrink:0;
  -webkit-user-select:none; user-select:none;
}
.nav-add-btn:active { transform:scale(0.93); box-shadow:0 2px 10px var(--accent-glow); }
.nav-add-btn svg { width:26px; height:26px; }

/* ── DAY SECTION HEADER ──────────────────────── */
.day-header { display:flex; align-items:center; gap:10px; margin-bottom:12px; margin-top:4px; }
.day-label { font-size:10px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:1.2px; white-space:nowrap; }
.day-line { flex:1; height:1px; background:var(--border); }
.carried-badge {
  font-size:10px; padding:3px 9px; border-radius:99px;
  background:var(--amber-dim); color:var(--amber); font-weight:600;
  border:1px solid rgba(245,158,42,0.22);
}

/* ── TASK CARD ───────────────────────────────── */
.task-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r); margin-bottom:9px; overflow:hidden;
  transition:border-color 0.18s;
  animation:fadeSlideIn 0.22s ease;
}
.task-card.late    { border-left:3px solid var(--red); }
.task-card.hold-card { border-left:3px solid var(--hold); }
.task-card.carried { border-top:2px solid var(--amber); }
.task-card.done-card { opacity:0.48; }
.task-card.done-card.expanded { opacity:1; }

.card-top {
  display:flex; align-items:flex-start; gap:10px;
  padding:14px 14px; cursor:pointer; user-select:none;
  /* min touch target */
  min-height:56px;
}
.card-left { flex:1; min-width:0; }
.task-name-row { display:flex; align-items:flex-start; gap:7px; margin-bottom:6px; flex-wrap:wrap; }
.task-name { font-size:14px; font-weight:600; color:var(--text); line-height:1.4; word-break:break-word; }
.task-meta-row {
  display:flex; gap:10px; font-size:11px; color:var(--text3);
  font-family:'JetBrains Mono',monospace; flex-wrap:wrap;
}
.card-right { display:flex; flex-direction:column; align-items:flex-end; gap:7px; flex-shrink:0; padding-top:1px; }
.expand-arrow { width:18px; height:18px; color:var(--text3); transition:transform 0.22s ease; }
.task-card.expanded .expand-arrow { transform:rotate(180deg); }

/* ── BADGES & PILLS ──────────────────────────── */
.badge { font-size:10px; font-weight:700; padding:2px 8px; border-radius:99px; white-space:nowrap; letter-spacing:0.2px; }
.badge-late    { background:var(--red-dim);   color:var(--red);   border:1px solid rgba(255,83,114,0.22); }
.badge-carried { background:var(--amber-dim); color:var(--amber); border:1px solid rgba(245,158,42,0.22); }
.member-chip {
  display:inline-flex; align-items:center; gap:5px;
  font-size:11px; font-weight:600; color:var(--accent2);
  background:var(--surface3); border:1px solid var(--border2);
  padding:3px 9px 3px 6px; border-radius:99px;
}
.member-chip .m-avatar {
  width:16px; height:16px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(135deg,#5b7fff,#b08aff);
  display:flex; align-items:center; justify-content:center;
  font-size:9px; font-weight:800; color:#fff;
}

.status-pill { font-size:11px; font-weight:600; padding:4px 10px; border-radius:99px; border:1px solid transparent; white-space:nowrap; }
.sp-pending     { background:var(--surface2);  color:var(--text2);  border-color:var(--border2); }
.sp-in-progress { background:var(--amber-dim); color:var(--amber);  border-color:rgba(245,158,42,0.28); }
.sp-completed   { background:var(--green-dim); color:var(--green);  border-color:rgba(35,232,154,0.28); }
.sp-hold        { background:var(--hold-dim);  color:var(--hold);   border-color:rgba(176,138,255,0.28); }
.sp-qa-pass     { background:var(--teal-dim);  color:var(--teal);   border-color:rgba(20,208,181,0.28); }
.sp-issue-found { background:var(--rose-dim);  color:var(--rose);   border-color:rgba(255,122,69,0.28); }

/* ── EXPAND AREA ─────────────────────────────── */
.card-expand { max-height:0; overflow:hidden; transition:max-height 0.36s cubic-bezier(.4,0,.2,1); }
.task-card.expanded .card-expand { max-height:1400px; }
.expand-inner { border-top:1px solid var(--border); padding:14px; }

/* ── STATUS TIMELINE ─────────────────────────── */
.status-section { margin-bottom:16px; }
.status-section-label { font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:0.9px; font-weight:700; margin-bottom:10px; }
.status-timeline { display:flex; flex-direction:column; position:relative; padding-left:22px; }
.status-timeline::before { content:''; position:absolute; left:7px; top:10px; bottom:10px; width:1px; background:var(--border2); }
.timeline-item { display:flex; align-items:flex-start; gap:10px; padding:5px 0; position:relative; }
.timeline-dot { position:absolute; left:-18px; top:11px; width:10px; height:10px; border-radius:50%; border:2px solid var(--surface); background:var(--surface3); flex-shrink:0; }
.timeline-dot.t-active { background:var(--accent); box-shadow:0 0 8px var(--accent-glow); }
.timeline-dot.t-done   { background:var(--green);  box-shadow:0 0 8px rgba(35,232,154,0.4); }
.timeline-dot.t-hold   { background:var(--hold);   box-shadow:0 0 8px rgba(176,138,255,0.4); }
.timeline-dot.t-prog   { background:var(--amber);  box-shadow:0 0 8px rgba(245,158,42,0.4); }
.timeline-dot.t-qa     { background:var(--teal);   box-shadow:0 0 8px rgba(20,208,181,0.4); }
.timeline-dot.t-issue  { background:var(--rose);   box-shadow:0 0 8px rgba(255,122,69,0.4); }
.timeline-content { flex:1; }
.timeline-status-row { display:flex; align-items:center; justify-content:space-between; gap:6px; flex-wrap:wrap; }
.timeline-status-name { font-size:13px; font-weight:600; color:var(--text); }
.timeline-time  { font-size:11px; color:var(--text3); font-family:'JetBrains Mono',monospace; }
.timeline-note  { font-size:12px; color:var(--text2); margin-top:3px; line-height:1.5; }

/* ── STATUS CHANGE FORM ──────────────────────── */
.status-change-form { background:var(--surface2); border:1px solid var(--border2); border-radius:var(--r-sm); padding:12px; }

/* 2-col status buttons on mobile */
.status-buttons { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:10px; }
.status-btn {
  font-size:12px; font-weight:600; padding:10px 8px; border-radius:var(--r-xs);
  cursor:pointer; border:1px solid transparent; transition:all 0.14s;
  font-family:'Plus Jakarta Sans',sans-serif; text-align:center;
  min-height:42px; /* touch target */
}
.status-btn.is-current  { opacity:0.36; cursor:default; pointer-events:none; }
.status-btn.selected-btn { outline:2px solid white; outline-offset:2px; }
.sb-pending     { background:var(--surface3); color:var(--text2); border-color:var(--border2); }
.sb-in-progress { background:var(--amber-dim); color:var(--amber); border-color:rgba(245,158,42,0.3); }
.sb-completed   { background:var(--green-dim); color:var(--green); border-color:rgba(35,232,154,0.3); }
.sb-hold        { background:var(--hold-dim);  color:var(--hold);  border-color:rgba(176,138,255,0.3); }
.sb-qa-pass     { background:var(--teal-dim);  color:var(--teal);  border-color:rgba(20,208,181,0.3); }
.sb-issue-found { background:var(--rose-dim);  color:var(--rose);  border-color:rgba(255,122,69,0.3); }

.status-note-input {
  width:100%; padding:11px 12px;
  background:var(--surface3); border:1px solid var(--border2); border-radius:var(--r-xs);
  color:var(--text); font-family:'Plus Jakarta Sans',sans-serif; font-size:14px;
  outline:none; transition:border-color 0.18s; margin-bottom:8px;
}
.status-note-input:focus { border-color:var(--accent); }
.status-note-input::placeholder { color:var(--text3); }
.hold-reason-row { display:none; }
.hold-reason-row.show { display:block; }

.status-save-btn {
  width:100%; font-size:13px; font-weight:700; padding:13px;
  border-radius:var(--r-xs); background:var(--accent); color:#fff;
  border:none; cursor:pointer; font-family:'Plus Jakarta Sans',sans-serif;
  transition:opacity 0.14s, transform 0.14s;
  min-height:48px;
}
.status-save-btn:active { opacity:0.82; transform:scale(0.98); }

/* ── DETAILS GRID ────────────────────────────── */
.details-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
.detail-label { font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:3px; font-weight:600; }
.detail-value { font-size:12px; color:var(--text); font-family:'JetBrains Mono',monospace; word-break:break-word; }
.task-notes-display {
  font-size:13px; color:var(--text2); line-height:1.7;
  background:var(--surface2); border-radius:var(--r-xs);
  padding:11px 12px; margin-bottom:12px; border:1px solid var(--border);
}
.card-actions { display:flex; gap:8px; }
.card-actions .btn { flex:1; justify-content:center; }

/* ── CARRIED SECTION ─────────────────────────── */
.nextday-section { margin-top:22px; }

/* ── BACKDATE TOGGLE ──────────────────────────── */
.backdate-toggle-row {
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--surface2); border:1px solid var(--border2);
  border-radius:var(--r-xs); padding:12px 14px;
}
.backdate-toggle-label { font-size:13px; font-weight:600; color:var(--text); }
.backdate-toggle-sub { font-size:11px; color:var(--text3); margin-top:2px; }
.switch { position:relative; width:44px; height:26px; flex-shrink:0; }
.switch input { opacity:0; width:0; height:0; }
.switch-track {
  position:absolute; inset:0; background:var(--surface3); border:1px solid var(--border2);
  border-radius:99px; cursor:pointer; transition:background 0.18s, border-color 0.18s;
}
.switch-track::before {
  content:''; position:absolute; width:18px; height:18px; left:3px; top:2px;
  background:var(--text2); border-radius:50%; transition:transform 0.18s, background 0.18s;
}
.switch input:checked + .switch-track { background:var(--accent); border-color:var(--accent); }
.switch input:checked + .switch-track::before { transform:translateX(18px); background:#fff; }
.backdate-field { display:none; margin-top:10px; }
.backdate-field.show { display:block; }

/* ── SUMMARY PANEL ───────────────────────────── */
.summary-member-block { margin-bottom:22px; }
.summary-member-head {
  display:flex; align-items:center; gap:10px; margin-bottom:12px;
  padding-bottom:10px; border-bottom:1px solid var(--border);
}
.summary-avatar {
  width:34px; height:34px; border-radius:10px; flex-shrink:0;
  background:linear-gradient(135deg,#5b7fff,#b08aff);
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:800; color:#fff;
}
.summary-member-name { font-size:15px; font-weight:800; color:var(--text); letter-spacing:-0.2px; }
.summary-member-count { font-size:11px; color:var(--text3); font-family:'JetBrains Mono',monospace; }
.summary-day-block { margin-bottom:16px; padding-left:2px; }
.summary-day-label {
  font-size:10px; font-weight:700; color:var(--accent2); text-transform:uppercase;
  letter-spacing:1.1px; margin-bottom:9px;
}
.summary-entry {
  display:flex; align-items:flex-start; gap:9px; padding:8px 10px;
  background:var(--surface); border:1px solid var(--border); border-left:2px solid var(--surface3);
  border-radius:var(--r-xs); margin-bottom:6px;
}
.summary-entry.se-in-progress { border-left-color:var(--amber); }
.summary-entry.se-completed   { border-left-color:var(--green); }
.summary-entry.se-hold        { border-left-color:var(--hold); }
.summary-entry.se-qa-pass     { border-left-color:var(--teal); }
.summary-entry.se-issue-found { border-left-color:var(--rose); }
.summary-entry-body { flex:1; min-width:0; }
.summary-entry-row { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.summary-entry-task { font-size:13px; font-weight:600; color:var(--text); }
.summary-entry-status { font-size:11px; font-weight:700; }
.summary-entry-note { font-size:12px; color:var(--text2); margin-top:3px; line-height:1.5; }
.summary-entry-time { font-size:10px; color:var(--text3); font-family:'JetBrains Mono',monospace; white-space:nowrap; margin-left:auto; }
.summary-filter-row { display:flex; gap:8px; margin-bottom:16px; }
.summary-filter-row select { flex:1; }

/* ── FORM (Add & Filter panels) ──────────────── */
.card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r); padding:16px; margin-bottom:12px;
}
.panel-title { font-size:15px; font-weight:800; letter-spacing:-0.3px; margin-bottom:16px; color:var(--text); }
.form-grid { display:flex; flex-direction:column; gap:12px; margin-bottom:14px; }
.form-row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.form-group { display:flex; flex-direction:column; gap:6px; }

label {
  font-size:11px; font-weight:700; color:var(--text2);
  text-transform:uppercase; letter-spacing:0.6px;
}
input[type="text"],
input[type="number"],
input[type="date"],
input[type="datetime-local"],
select, textarea {
  padding:13px 14px;
  background:var(--surface2); border:1px solid var(--border2);
  border-radius:var(--r-xs); color:var(--text);
  font-family:'Plus Jakarta Sans',sans-serif; font-size:16px; /* 16px prevents iOS zoom */
  outline:none; transition:border-color 0.18s, box-shadow 0.18s;
  width:100%; -webkit-appearance:none; appearance:none;
  min-height:48px; /* comfortable touch target */
}
input:focus, select:focus, textarea:focus {
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(91,127,255,0.14);
}
select option { background:var(--surface2); }
textarea { resize:none; min-height:88px; line-height:1.6; font-size:15px; }

/* ── BUTTONS ─────────────────────────────────── */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:13px 18px; border-radius:var(--r-xs);
  font-family:'Plus Jakarta Sans',sans-serif; font-size:14px; font-weight:700;
  cursor:pointer; border:none; transition:all 0.16s;
  min-height:48px; /* touch target */
  -webkit-user-select:none; user-select:none;
}
.btn-primary {
  background:linear-gradient(135deg,#5b7fff,#7c9bff);
  color:#fff; width:100%;
  box-shadow:0 4px 18px var(--accent-glow);
}
.btn-primary:active { transform:scale(0.97); opacity:0.9; }
.btn-ghost {
  background:transparent; color:var(--text2);
  border:1px solid var(--border2); font-size:13px;
}
.btn-ghost:active { background:var(--surface2); color:var(--text); }
.btn-danger {
  background:transparent; color:var(--red);
  border:1px solid rgba(255,83,114,0.22); font-size:13px;
}
.btn-danger:active { background:var(--red-dim); }
.btn-edit {
  background:transparent; color:var(--blue);
  border:1px solid rgba(56,196,248,0.22); font-size:13px;
}
.btn-edit:active { background:var(--blue-dim); }
.btn-full { width:100%; }

/* ── MODAL (bottom sheet on mobile) ─────────── */
.modal-overlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.7); backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px); z-index:500;
  align-items:flex-end; /* sheet slides from bottom */
  justify-content:center;
}
.modal-overlay.open { display:flex; }

.modal {
  background:var(--surface);
  border:1px solid var(--border2);
  border-radius:20px 20px 0 0; /* top rounded only */
  padding:20px 16px;
  padding-bottom:calc(20px + var(--safe-b));
  width:100%; max-width:600px;
  max-height:92dvh; overflow-y:auto;
  animation:sheetUp 0.28s cubic-bezier(.4,0,.2,1);
}
@keyframes sheetUp { from{transform:translateY(100%);} to{transform:translateY(0);} }

.modal-handle {
  width:36px; height:4px; border-radius:99px;
  background:var(--surface3); margin:0 auto 18px;
}
.modal h3 {
  font-size:17px; font-weight:800; margin-bottom:18px;
  color:var(--text); letter-spacing:-0.3px;
}
.modal-footer { display:flex; gap:8px; margin-top:16px; }
.modal-footer .btn { flex:1; }

/* ── EMPTY STATE ─────────────────────────────── */
.empty { text-align:center; padding:56px 20px 40px; }
.empty-icon { font-size:40px; margin-bottom:14px; opacity:0.4; }
.empty-title { font-size:15px; font-weight:700; color:var(--text2); margin-bottom:6px; }
.empty-sub { font-size:13px; color:var(--text3); line-height:1.5; }

/* ── MISC ────────────────────────────────────── */
input[type="datetime-local"]::-webkit-calendar-picker-indicator,
input[type="date"]::-webkit-calendar-picker-indicator { filter:invert(0.35); cursor:pointer; }
::-webkit-scrollbar { width:3px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--surface3); border-radius:99px; }

@keyframes fadeSlideIn { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }

/* ── TABLET+ ADJUSTMENTS ─────────────────────── */
@media(min-width:600px) {
  .container { padding:18px 20px 8px; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; }
  .form-row2 { grid-column:1/-1; grid-template-columns:1fr 1fr; }
  .form-group.full { grid-column:1/-1; }
  .modal { border-radius:var(--r) var(--r) 0 0; }
  .status-buttons { grid-template-columns:repeat(4,1fr); }
  .card-actions .btn { flex:0 0 auto; }
}
@media(min-width:768px) {
  .modal-overlay { align-items:center; }
  .modal { border-radius:var(--r); width:520px; padding-bottom:20px; }
  @keyframes sheetUp { from{opacity:0;transform:scale(0.97);} to{opacity:1;transform:scale(1);} }
}

/* ── DESKTOP LAYOUT ────────────────────────────
   Nav bar stays a bottom bar at every width. From
   here up we just give the centered content more
   breathing room instead of stretching edge to edge. */
@media(min-width:1024px) {
  .header-inner { max-width:1000px; }

  .stats-strip { max-width:820px; margin:0 auto 14px; }

  #task-list {

    gap:20px; align-items:start; max-width:900px; margin:0 auto;
  }

  .modal { width:560px; }
}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, updateDoc, deleteDoc, doc,
  onSnapshot, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ── PASTE YOUR FIREBASE CONFIG HERE ─────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyC2PdZnpAPBBFJf1Ti_nw6Q1HmHx-a61Y4",
  authDomain: "task-track-a81d0.firebaseapp.com",
  projectId: "task-track-a81d0",
  storageBucket: "task-track-a81d0.firebasestorage.app",
  messagingSenderId: "142120942754",
  appId: "1:142120942754:web:fb5e0239fd43632a012bfb"
};

// ── TEAM MEMBERS — edit this list for your team ─────────────────
const MEMBERS = ["NA", "RR", "AB"];

const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const tasksCol = collection(db, "tasks");

let tasks = [];
let editId = null;
let pendingStatus = {};
let firestoreReady = false;

// ── STATUS CONFIG ────────────────────────────────────────────────
const STATUS_ORDER = ["pending", "in-progress", "hold", "qa-pass", "issue-found", "completed"];
const STATUS_META = {
  "pending":     { label: "Pending",      reasonRequired: false },
  "in-progress": { label: "In Progress",  reasonRequired: false },
  "hold":        { label: "On Hold",      reasonRequired: true, reasonPlaceholder: "Reason for hold (required)..." },
  "qa-pass":     { label: "QA Pass",      reasonRequired: true, reasonPlaceholder: "QA notes (required)..." },
  "issue-found": { label: "Issue Found",  reasonRequired: true, reasonPlaceholder: "Describe the issue (required)..." },
  "completed":   { label: "Completed",    reasonRequired: false }
};

function initials(name) {
  if (!name) return "?";
  const parts = name.trim().split(/\s+/);
  return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
}

function populateMemberSelects() {
  const opts = MEMBERS.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join("");
  const filterOpts = `<option value="">All members</option>` + opts;
  document.getElementById("inp-member").innerHTML = opts;
  document.getElementById("e-member").innerHTML = opts;
  document.getElementById("f-member").innerHTML = filterOpts;
  document.getElementById("sum-member").innerHTML = filterOpts;
}

// ── FIRESTORE LIVE SYNC ──────────────────────────────────────────
function startSync() {
  const q = query(tasksCol, orderBy("created", "desc"));
  onSnapshot(q, snap => {
    tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    normalizeTasks();
    firestoreReady = true;
    renderTasks();
    if (document.getElementById("panel-summary").classList.contains("active")) renderSummary();
  }, err => {
    console.error("Firestore sync error:", err);
    document.getElementById("task-list").innerHTML =
      `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">Can't connect to Firebase</div>` +
      `<div class="empty-sub">Check the firebaseConfig values in index.html and your Firestore security rules.</div></div>`;
  });
}

function normalizeTasks() {
  const today = todayStr();
  tasks.forEach(t => {
    if (!t.createdDate) {
      t.createdDate = t.created ? new Date(t.created).toISOString().slice(0, 10) : today;
    }
    if (t.status !== "completed") {
      t.carried = t.createdDate < today;
    } else {
      t.carried = false;
    }
    if (!t.history) t.history = [{ status: t.status, time: t.created || Date.now(), note: "Task created" }];
  });
}

function genId() { return Date.now() + "" + Math.random().toString(36).slice(2, 6); }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function dateStr(ts) { try { return new Date(ts).toISOString().slice(0, 10); } catch { return ""; } }

function fmtFull(dt) {
  if (!dt) return "—";
  try { return new Date(dt).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }); } catch { return dt; }
}
function fmtTime(ts) {
  if (!ts) return "";
  try { return new Date(ts).toLocaleString([], { dateStyle: "short", timeStyle: "short" }); } catch { return ""; }
}
function fmtClock(ts) {
  if (!ts) return "";
  try { return new Date(ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); } catch { return ""; }
}
function fmtDate(dt) {
  if (!dt) return "—";
  try { return new Date(dt).toLocaleDateString([], { dateStyle: "medium" }); } catch { return dt; }
}

function updateHeaderDate() {
  const el = document.getElementById("header-date");
  if (el) el.textContent = new Date().toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
}

function showTab(t) {
  ["tasks", "add", "filter", "summary"].forEach(x => {
    document.getElementById("panel-" + x).classList.toggle("active", x === t);
  });
  document.getElementById("nav-tasks")?.classList.toggle("active", t === "tasks");
  document.getElementById("nav-filter")?.classList.toggle("active", t === "filter");
  document.getElementById("nav-summary")?.classList.toggle("active", t === "summary");
  if (t === "tasks" || t === "filter") renderTasks();
  if (t === "summary") renderSummary();
}

function toggleBackdateField() {
  const on = document.getElementById("inp-backdate-on").checked;
  const field = document.getElementById("backdate-field");
  field.classList.toggle("show", on);
  if (on) {
    const bd = document.getElementById("inp-backdate");
    if (!bd.value) {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      bd.value = now.toISOString().slice(0, 16);
    }
  }
}

async function addTask() {
  const name = document.getElementById("inp-name").value.trim();
  if (!name) { alert("Task name is required."); return; }
  const member = document.getElementById("inp-member").value;

  const backdateOn = document.getElementById("inp-backdate-on").checked;
  const backdateVal = document.getElementById("inp-backdate").value;
  let createdTime = Date.now();
  if (backdateOn && backdateVal) {
    createdTime = new Date(backdateVal).getTime();
  }
  const createdDate = dateStr(createdTime);
  const startVal = document.getElementById("inp-start").value;

  const newTask = {
    name, member,
    project: document.getElementById("inp-proj").value.trim(),
    est: parseFloat(document.getElementById("inp-est").value) || 0,
    start: startVal || (backdateOn ? backdateVal : ""),
    notes: document.getElementById("inp-notes").value.trim(),
    status: "pending",
    created: createdTime,
    createdDate,
    carried: createdDate < todayStr(),
    history: [{ status: "pending", time: createdTime, note: "Task created" }]
  };

  try {
    await addDoc(tasksCol, newTask);
  } catch (err) {
    console.error(err);
    alert("Could not save task to Firebase. Check your connection and Firestore rules.");
    return;
  }

  ["inp-name", "inp-proj", "inp-est", "inp-start", "inp-notes", "inp-backdate"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("inp-member").selectedIndex = 0;
  document.getElementById("inp-backdate-on").checked = false;
  document.getElementById("backdate-field").classList.remove("show");
  showTab("tasks");
}

function yesterdayStr() {
  const d = new Date(); d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0, 10);
}

function getFiltered() {
  const fp = (document.getElementById("f-proj").value || "").toLowerCase();
  const ff = document.getElementById("f-from").value;
  const ft = document.getElementById("f-to").value;
  const fs = document.getElementById("f-status").value;
  const fm = document.getElementById("f-member") ? document.getElementById("f-member").value : "";
  const fday = document.getElementById("f-day") ? document.getElementById("f-day").value : "";
  const yesterday = yesterdayStr();

  return tasks.filter(t => {
    if (fp && !(t.project || "").toLowerCase().includes(fp)) return false;
    if (fm && t.member !== fm) return false;
    if (fday === "today") {
      const today = todayStr();
      const createdToday = (t.createdDate || today) === today;
      const carriedToday = t.carried && t.status !== "completed";
      const completedToday = t.status === "completed" && (t.history || []).some(h =>
        h.status === "completed" && h.time && dateStr(h.time) === today
      );
      if (!createdToday && !carriedToday && !completedToday) return false;
    }
    if (fday === "yesterday") {
      const yest = yesterday;
      const createdYesterday = (t.createdDate || "") === yest;
      const hadActivityYesterday = (t.history || []).some(h => h.time && dateStr(h.time) === yest);
      if (!createdYesterday && !hadActivityYesterday) return false;
    }
    if (ff && (t.createdDate || "") < ff) return false;
    if (ft && (t.createdDate || "") > ft) return false;
    if (fs && t.status !== fs) return false;
    return true;
  }).sort((a, b) => {
    if (a.status === "completed" && b.status !== "completed") return 1;
    if (b.status === "completed" && a.status !== "completed") return -1;
    if (!a.start) return 1; if (!b.start) return -1;
    return a.start < b.start ? -1 : 1;
  });
}

function clearFilters() {
  ["f-proj", "f-from", "f-to"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("f-status").value = "";
  if (document.getElementById("f-member")) document.getElementById("f-member").value = "";
  if (document.getElementById("f-day")) document.getElementById("f-day").value = "";
  renderTasks();
}

function statusLabel(s) { return (STATUS_META[s] && STATUS_META[s].label) || s; }
function statusPillClass(s) { return "sp-" + s; }
function timelineDotClass(s) {
  return { pending: "", "in-progress": "t-prog", completed: "t-done", hold: "t-hold", "qa-pass": "t-qa", "issue-found": "t-issue" }[s] || "";
}
function esc(s) { const d = document.createElement("div"); d.textContent = String(s || ""); return d.innerHTML; }

function toggleExpand(taskId) {
  const card = document.querySelector('[data-id="' + taskId + '"]');
  if (card) card.classList.toggle("expanded");
}

function selectStatusBtn(taskId, status, btn) {
  const grp = document.getElementById("sbgrp-" + taskId);
  if (grp) grp.querySelectorAll(".status-btn").forEach(b => b.classList.remove("selected-btn"));
  btn.classList.add("selected-btn");
  pendingStatus[taskId] = status;
  const holdRow = document.getElementById("hold-row-" + taskId);
  const meta = STATUS_META[status];
  if (holdRow) {
    holdRow.classList.toggle("show", !!(meta && meta.reasonRequired));
    const input = document.getElementById("hold-note-" + taskId);
    if (input && meta) input.placeholder = meta.reasonPlaceholder || "Reason (required)...";
  }
}

async function applyStatusChange(taskId) {
  const t = tasks.find(x => x.id === taskId);
  if (!t) return;
  const newStatus = pendingStatus[taskId];
  if (!newStatus || newStatus === t.status) { alert("Please select a different status."); return; }

  const meta = STATUS_META[newStatus] || {};
  let note = (document.getElementById("snote-" + taskId) || {}).value || "";
  if (meta.reasonRequired) {
    const hr = (document.getElementById("hold-note-" + taskId) || {}).value || "";
    if (!hr.trim()) { alert("Please add a reason for " + statusLabel(newStatus) + "."); return; }
    note = (note ? hr + " — " + note : hr);
  }

  const newHistory = (t.history || []).concat([{ status: newStatus, time: Date.now(), note }]);
  const today = todayStr();
  const newCarried = newStatus === "completed" ? false : (t.createdDate || today) < today;

  try {
    await updateDoc(doc(db, "tasks", taskId), { status: newStatus, history: newHistory, carried: newCarried });
  } catch (err) {
    console.error(err);
    alert("Could not update task in Firebase.");
    return;
  }

  delete pendingStatus[taskId];
  const expanded = document.querySelector('[data-id="' + taskId + '"]')?.classList.contains("expanded");
  if (expanded) setTimeout(() => {
    const card = document.querySelector('[data-id="' + taskId + '"]');
    if (card) card.classList.add("expanded");
  }, 30);
}

async function deleteTask(id) {
  if (!confirm("Delete this task?")) return;
  try { await deleteDoc(doc(db, "tasks", id)); }
  catch (err) { console.error(err); alert("Could not delete task in Firebase."); }
}

function openEdit(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  editId = id;
  document.getElementById("e-name").value = t.name;
  document.getElementById("e-member").value = t.member || MEMBERS[0];
  document.getElementById("e-proj").value = t.project || "";
  document.getElementById("e-est").value = t.est || "";
  document.getElementById("e-start").value = t.start || "";
  document.getElementById("e-notes").value = t.notes || "";
  document.getElementById("modal").classList.add("open");
}

function closeModal() { document.getElementById("modal").classList.remove("open"); editId = null; }

async function saveEdit() {
  const t = tasks.find(x => x.id === editId);
  if (!t) return;
  const name = document.getElementById("e-name").value.trim();
  if (!name) { alert("Task name is required."); return; }
  const updated = {
    name,
    member: document.getElementById("e-member").value,
    project: document.getElementById("e-proj").value.trim(),
    est: parseFloat(document.getElementById("e-est").value) || 0,
    start: document.getElementById("e-start").value,
    notes: document.getElementById("e-notes").value.trim()
  };
  try {
    await updateDoc(doc(db, "tasks", editId), updated);
  } catch (err) {
    console.error(err);
    alert("Could not save changes to Firebase.");
    return;
  }
  closeModal();
}

document.getElementById("modal").addEventListener("click", function (e) { if (e.target === this) closeModal(); });

function buildTaskCard(t, isNextDay) {
  const now = Date.now();
  const late = t.start && new Date(t.start).getTime() < now && t.status !== "completed" && t.status !== "hold";
  const history = t.history || [];

  let cardClass = "task-card";
  if (late) cardClass += " late";
  if (t.status === "completed") cardClass += " done-card";
  if (t.status === "hold") cardClass += " hold-card";
  if (isNextDay) cardClass += " carried";

  const timelineHtml = history.map((h, i) => {
    const isLast = i === history.length - 1;
    const dotCls = isLast ? timelineDotClass(h.status) : "";
    return `<div class="timeline-item">
      <div class="timeline-dot ${dotCls}"></div>
      <div class="timeline-content">
        <div class="timeline-status-row">
          <span class="timeline-status-name">${esc(statusLabel(h.status))}</span>
          <span class="timeline-time">${fmtTime(h.time)}</span>
        </div>
        ${h.note ? `<div class="timeline-note">${esc(h.note)}</div>` : ""}
      </div>
    </div>`;
  }).join("");

  const statusBtns = STATUS_ORDER.map(s => {
    const isCurrent = t.status === s;
    return `<button class="status-btn sb-${s}${isCurrent ? " is-current" : ""}" onclick="${isCurrent ? "" : `selectStatusBtn('${t.id}','${s}',this)`}">${statusLabel(s)}</button>`;
  }).join("");

  const memberHtml = t.member
    ? `<span class="member-chip"><span class="m-avatar">${esc(initials(t.member))}</span>${esc(t.member)}</span>`
    : "";

  return `<div class="${cardClass}" data-id="${t.id}">
    <div class="card-top" onclick="toggleExpand('${t.id}')">
      <div class="card-left">
        <div class="task-name-row">
          <span class="task-name">${esc(t.name)}</span>
          ${late ? '<span class="badge badge-late">Late</span>' : ""}
          ${isNextDay ? '<span class="badge badge-carried">Carried</span>' : ""}
        </div>
        <div class="task-meta-row">
          ${memberHtml}
          ${t.project ? `<span>📁 ${esc(t.project)}</span>` : ""}
          ${t.est ? `<span>⏱ ${t.est}h</span>` : ""}
          ${t.start ? `<span>📅 ${fmtDate(t.start)}</span>` : ""}
        </div>
      </div>
      <div class="card-right">
        <span class="status-pill ${statusPillClass(t.status)}">${statusLabel(t.status)}</span>
        <svg class="expand-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>

    <div class="card-expand">
      <div class="expand-inner">

        <div class="status-section">
          <div class="status-section-label">Change Status</div>
          <div class="status-change-form">
            <div class="status-buttons" id="sbgrp-${t.id}">${statusBtns}</div>
            <div class="hold-reason-row" id="hold-row-${t.id}">
              <input type="text" class="status-note-input" id="hold-note-${t.id}" placeholder="Reason (required)...">
            </div>
            <input type="text" class="status-note-input" id="snote-${t.id}" placeholder="Add a note for this change (optional)...">
            <button class="status-save-btn" onclick="applyStatusChange('${t.id}')">Apply Status Change</button>
          </div>
        </div>

        ${history.length ? `<div class="status-section">
          <div class="status-section-label">Status History</div>
          <div class="status-timeline">${timelineHtml}</div>
        </div>` : ""}

        <div class="details-grid">
          <div><div class="detail-label">Member</div><div class="detail-value">${esc(t.member || "—")}</div></div>
          <div><div class="detail-label">Project</div><div class="detail-value">${esc(t.project || "—")}</div></div>
          <div><div class="detail-label">Estimated</div><div class="detail-value">${t.est ? t.est + " hrs" : "—"}</div></div>
          <div><div class="detail-label">Start time</div><div class="detail-value">${fmtFull(t.start)}</div></div>
          <div><div class="detail-label">Created</div><div class="detail-value">${fmtTime(t.created)}</div></div>
        </div>

        ${t.notes ? `<div class="task-notes-display">${esc(t.notes)}</div>` : ""}

        <div class="card-actions">
          <button class="btn btn-edit" onclick="openEdit('${t.id}')">Edit</button>
          <button class="btn btn-danger" onclick="deleteTask('${t.id}')">Delete</button>
        </div>

      </div>
    </div>
  </div>`;
}

function updateRing(pct) {
  const circ = 87.96; /* 2π×14 */
  const ring = document.getElementById("hdr-ring");
  const pctEl = document.getElementById("hdr-pct");
  if (ring) ring.style.strokeDashoffset = circ - (circ * pct / 100);
  if (pctEl) pctEl.textContent = pct + "%";
}

function renderTasks() {
  if (!firestoreReady) return;
  const filtered = getFiltered();
  const total = tasks.length,
    done = tasks.filter(t => t.status === "completed").length,
    prog = tasks.filter(t => t.status === "in-progress").length,
    hold = tasks.filter(t => t.status === "hold").length,
    pend = tasks.filter(t => t.status === "pending").length;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;

  document.getElementById("s-total").textContent = total;
  document.getElementById("s-done").textContent = done;
  document.getElementById("s-prog").textContent = prog;
  document.getElementById("s-hold").textContent = hold;
  document.getElementById("s-pend").textContent = pend;
  updateRing(pct);

  const el = document.getElementById("task-list");

  const fp = (document.getElementById("f-proj").value || "").trim();
  const ff = document.getElementById("f-from").value;
  const ft = document.getElementById("f-to").value;
  const fs = document.getElementById("f-status").value;
  const fm = document.getElementById("f-member") ? document.getElementById("f-member").value : "";
  const fday = document.getElementById("f-day") ? document.getElementById("f-day").value : "";
  const hasFilter = fp || ff || ft || fs || fm || fday;

  const today = todayStr();
  let todayTasks, carriedTasks;

  if (!hasFilter) {
    todayTasks = filtered.filter(t => {
      const createdToday = (t.createdDate || today) === today;
      const completedToday = t.status === "completed" && (t.history || []).some(h =>
        h.status === "completed" && h.time && dateStr(h.time) === today
      );
      return createdToday || completedToday;
    });
    carriedTasks = filtered.filter(t => t.carried && t.status !== "completed" && (t.createdDate || today) < today);
  } else {
    todayTasks = filtered.filter(t => !t.carried || t.status === "completed");
    carriedTasks = filtered.filter(t => t.carried && t.status !== "completed");
  }

  if (!todayTasks.length && !carriedTasks.length) {
    el.innerHTML = `<div class="empty">
      <div class="empty-icon">📋</div>
      <div class="empty-title">${tasks.length === 0 ? "No tasks yet" : "Nothing matches"}</div>
      <div class="empty-sub">${tasks.length === 0 ? "Tap the + button to add your first task" : "Try adjusting your filters"}</div>
    </div>`;
    return;
  }

  let html = "";
  if (todayTasks.length) html += todayTasks.map(t => buildTaskCard(t, false)).join("");
  if (carriedTasks.length) {
    html += `<div class="nextday-section">
      <div class="day-header">
        <div class="day-label">Carried to Today</div>
        <div class="day-line"></div>
        <span class="carried-badge">${carriedTasks.length} overdue</span>
      </div>
      ${carriedTasks.map(t => buildTaskCard(t, true)).join("")}
    </div>`;
  }
  el.innerHTML = html;
}

// ── SUMMARY VIEW ──────────────────────────────────────────────────
// Groups every status-history entry per member, per calendar day, so
// a task shows up once for each day it had activity — matching how a
// team stand-up summary reads (member → day → task - status - reason).
function dayLabel(ds) {
  const today = todayStr();
  const yest = yesterdayStr();
  if (ds === today) return "Today";
  if (ds === yest) return "Yesterday";
  try {
    return new Date(ds + "T00:00:00").toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" });
  } catch { return ds; }
}

function renderSummary() {
  if (!firestoreReady) return;
  const memberFilter = document.getElementById("sum-member").value;
  const range = document.getElementById("sum-range").value;
  const el = document.getElementById("summary-list");

  let minDate = null;
  if (range !== "all") {
    const d = new Date(); d.setDate(d.getDate() - parseInt(range, 10));
    minDate = d.toISOString().slice(0, 10);
  }

  const members = memberFilter ? [memberFilter] : MEMBERS.filter(m =>
    tasks.some(t => t.member === m)
  );

  if (!members.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">🗒️</div><div class="empty-title">No activity yet</div><div class="empty-sub">Tasks will show up here once members start logging work.</div></div>`;
    return;
  }

  let html = "";
  members.forEach(member => {
    const memberTasks = tasks.filter(t => t.member === member);
    if (!memberTasks.length) return;

    // day -> [{taskName, status, note, time}]
    const byDay = {};
    memberTasks.forEach(t => {
      (t.history || []).forEach(h => {
        const ds = dateStr(h.time);
        if (!ds) return;
        if (minDate && ds < minDate) return;
        if (!byDay[ds]) byDay[ds] = [];
        byDay[ds].push({ taskName: t.name, status: h.status, note: h.note, time: h.time });
      });
    });

    const days = Object.keys(byDay).sort((a, b) => (a < b ? 1 : -1));
    if (!days.length) return;

    let dayHtml = "";
    days.forEach(ds => {
      const entries = byDay[ds].sort((a, b) => (a.time || 0) - (b.time || 0));
      dayHtml += `<div class="summary-day-block">
        <div class="summary-day-label">${esc(dayLabel(ds))}</div>
        ${entries.map(e => `
          <div class="summary-entry se-${e.status}">
            <div class="summary-entry-body">
              <div class="summary-entry-row">
                <span class="summary-entry-task">${esc(e.taskName)}</span>
                <span class="summary-entry-status" style="color:var(--text2)">— ${esc(statusLabel(e.status))}</span>
                <span class="summary-entry-time">${esc(fmtClock(e.time))}</span>
              </div>
              ${e.note ? `<div class="summary-entry-note">${esc(e.note)}</div>` : ""}
            </div>
          </div>`).join("")}
      </div>`;
    });

    html += `<div class="summary-member-block">
      <div class="summary-member-head">
        <div class="summary-avatar">${esc(initials(member))}</div>
        <div>
          <div class="summary-member-name">${esc(member)}</div>
          <div class="summary-member-count">${memberTasks.length} task${memberTasks.length === 1 ? "" : "s"}</div>
        </div>
      </div>
      ${dayHtml}
    </div>`;
  });

  el.innerHTML = html || `<div class="empty"><div class="empty-icon">🗒️</div><div class="empty-title">No activity in this range</div><div class="empty-sub">Try a wider date range.</div></div>`;
}

// ── EXPOSE FUNCTIONS CALLED FROM inline onclick/onchange ──────────
Object.assign(window, {
  showTab, addTask, clearFilters, deleteTask, openEdit, closeModal, saveEdit,
  applyStatusChange, selectStatusBtn, toggleExpand, toggleBackdateField,
  renderTasks, renderSummary
});

  populateMemberSelects();

  startSync();
  setTimeout(() => {
    document.getElementById("splash").classList.add("hide");
    setTimeout(() => {
      document.getElementById("splash").style.display = "none";
      document.getElementById("app").classList.add("visible");
    }, 650);
  }, 2200);
});
